# MineSkyEvents - Configuração principal
# Servidor dedicado de eventos (um mundo, sem inventário persistente)

timezone: America/Sao_Paulo
min-players: 2
signup-timeout-seconds: 600
countdown-seconds: 60
weekend-schedule-enabled: false

proxy:
  server-name: eventos
  hub-server: lobby

chat:
  global-bridge:
    enabled: true
    server-id: eventos
    format: "<gray>[g]</gray> <aqua>[Eventos]</aqua> <gray><name></gray><dark_gray>: </dark_gray><message>"

spectator:
  boundary-margin: 8.0

# Comandos bloqueados para jogadores sem mineskyevents.admin (raiz do comando, sem /)
blocked-commands:
  - pl
  - plugins
  - plugin
  - about
  - version
  - ver
  - bukkit
  - spigot
  - paper
  - icanhasbukkit
  - "?"

tijolao:
  throw-cooldown-ms: 800
  brick-damage: 4.0

rewards:
  scale-by-players: true
