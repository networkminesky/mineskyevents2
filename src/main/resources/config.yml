# MineSkyEvents - Configuração principal
# Servidor dedicado de eventos (um mundo, sem inventário persistente)

timezone: America/Sao_Paulo
min-players: 2
signup-timeout-seconds: 600
countdown-seconds: 60
weekend-schedule-enabled: false

proxy:
  channel: minesky:proxy
  server-name: eventos
  hub-server: lobby

# Comandos bloqueados para jogadores sem mineskyevents.admin (raiz do comando, sem /)
blocked-commands:
  - pl
  - plugins
  - plugin
  - about
  - version
  - ver
  - bukkit
  - spigot
  - paper
  - icanhasbukkit
  - "?"

tijolao:
  throw-cooldown-ms: 800
  brick-damage: 4.0

rewards:
  scale-by-players: true
