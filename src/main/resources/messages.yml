prefix: "<gradient:#00d4ff:#7b2ff7><bold>MineSky</bold></gradient> <dark_gray>»</dark_gray> "

event:
  announced: "{prefix}<gradient:#4ade80:#22d3ee>O evento <white><bold>{event}</bold></white> foi anunciado!</gradient>\n<gray>Mapa: <white>{map}</white> · Use <white>/evento entrar</white> para participar!</gray>"
  description: "{prefix}<gray>{description}</gray>"
  countdown: "<gradient:#fbbf24:#f97316>Iniciando em <white><bold>{seconds}s</bold></white>...</gradient>"
  started: "{prefix}<gradient:#4ade80:#22d3ee><bold>O evento começou!</bold></gradient> <gray>Boa sorte a todos!</gray>"
  cancelled: "{prefix}<red>O evento foi cancelado por falta de jogadores.</red>"
  winner: "{prefix}<gradient:#fbbf24:#f97316><bold>{player}</bold></gradient> <gray>venceu o evento <white>{event}</white>!</gray>"
  placement: "{prefix}<gray>{place}º lugar: <white>{player}</white> — <green>${amount}</green></gray>"
  player-joined: "<gray>{player}</gray> <yellow>entrou no evento!</yellow> <dark_gray>({count} jogadores)</dark_gray>"
  player-left: "<gray>{player}</gray> <red>saiu do evento.</red>"
  stopped: "{prefix}<red>O evento foi encerrado por um administrador.</red>"
  left: "{prefix}<yellow>Você saiu do evento. Retornando ao lobby...</yellow>"
  joined-late: "{prefix}<green>Você entrou no evento <white>{event}</white> em andamento.</green>"
  joined-spectator: "{prefix}<gray>O evento <white>{event}</white> já começou. Você está assistindo como espectador.</gray>"
  kicked: "{prefix}<red>Você foi removido do evento.</red> <gray>Motivo: <white>{reason}</white></gray>"

errors:
  no-event: "{prefix}<red>Não há nenhum evento ativo no momento.</red>"
  not-in-event: "{prefix}<red>Você não está participando de nenhum evento.</red>"
  already-joined: "{prefix}<red>Você já está participando deste evento.</red>"
  event-running: "{prefix}<red>O evento já começou! Não é possível entrar agora.</red>"
  no-permission: "{prefix}<red>Você não tem permissão para isso.</red>"
  command-blocked: "{prefix}<red>Este comando não está disponível no servidor de eventos.</red>"
  server-closed: "{prefix}<red>O servidor de eventos está fechado. Aguarde o próximo evento!</red>"
  map-not-found: "{prefix}<red>Mapa <white>{map}</white> não encontrado.</red>"
  banned: "{prefix}<red>Você está banido dos eventos.</red> <gray>Motivo: <white>{reason}</white></gray>"
  tempbanned: "{prefix}<red>Você está banido dos eventos por <white>{time}</white>.</red> <gray>Motivo: <white>{reason}</white></gray>"
  player-offline: "{prefix}<red>Jogador <white>{player}</white> não está online.</red>"
  target-not-in-event: "{prefix}<red><white>{player}</white> não está no evento.</red>"
  invalid-duration: "{prefix}<red>Tempo inválido. Use 10m, 12h ou 1d.</red>"

admin:
  map-saved: "{prefix}<green>Ponto <white>{point}</white> salvo no mapa <white>{map}</white>!</green>"
  map-created: "{prefix}<green>Mapa <white>{map}</white> criado para <white>{event}</white>!</green>"
  region-saved: "{prefix}<green>Região do mapa <white>{map}</white> salva via WorldEdit!</green>"
  barrier-saved: "{prefix}<green>Barreira do mapa <white>{map}</white> salva via WorldEdit!</green>"
  event-started: "{prefix}<green>Evento <white>{event}</white> iniciado no mapa <white>{map}</white>!</green>"
  event-stopped: "{prefix}<yellow>Evento encerrado.</yellow>"
  force-started: "{prefix}<green>Evento iniciado agora. Jogadores foram para a arena.</green>"
  kicked: "{prefix}<yellow><white>{player}</white> foi kickado do evento.</yellow> <gray>({reason})</gray>"
  banned: "{prefix}<red><white>{player}</white> foi banido dos eventos.</red> <gray>({reason})</gray>"
  tempbanned: "{prefix}<red><white>{player}</white> banido por <white>{time}</white>.</red> <gray>({reason})</gray>"
  left-arena: "{prefix}<green>Você saiu da arena em modo criativo.</green>"
  no-worldedit: "{prefix}<red>WorldEdit não está instalado ou você não tem seleção ativa.</red>"
