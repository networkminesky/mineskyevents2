name: MineSkyEvents
version: '${version}'
main: net.mineskyevents.MineSkyEvents
api-version: '26.2'
load: POSTWORLD

authors: [ Bruno C., MineSky ]

description: Servidor dedicado de eventos MineSky com integração ao MineSkyProxy.

softdepend:
  - WorldEdit
  - mainframe

commands:
  event:
    description: Comandos de participação nos eventos.
  sair:
    aliases: [voltar, leave, spawn]
    description: Sai do evento e retorna ao survival.
  mse:
    aliases: [mineskyevents,msev]
    description: Comandos administrativos do MineSkyEvents.

permissions:
  mineskyevents.join:
    description: Permite entrar no servidor de eventos quando há um evento ativo.
    default: true
  mineskyevents.bypass:
    description: Permite entrar no servidor mesmo sem evento ativo (staff).
    default: op
  mineskyevents.admin:
    description: Comandos administrativos de eventos e mapas.
    default: op
  mineskyevents.changeteams:
    description: Permite escolher time no Mini Wars antes do início (/event time).
    default: false
  mineskyevents.bypassteamlimit:
    description: Ignora balanceamento e limites ao escolher time no Mini Wars.
    default: op
  mineskyevents.*:
    description: Todas as permissões do MineSkyEvents.
    default: op
    children:
      mineskyevents.join: true
      mineskyevents.bypass: true
      mineskyevents.admin: true
      mineskyevents.changeteams: true
      mineskyevents.bypassteamlimit: true
